<script>/* ===== Fartak Mother App — core ===== */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fa = (n) => (n === undefined || n === null || n === '' || isNaN(n) ? '—' : Number(n).toLocaleString('fa-IR'));
const when = (t) => (t ? new Date(t).toLocaleString('fa-IR', { dateStyle: 'short', timeStyle: 'short' }) : '—');
const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
const uid = (p) => p + Math.random().toString(36).slice(2, 8);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } };

/* ---------- servers (VPS profiles) ---------- */
const FIXED_SERVER_URL = String(window.__FARTAK_MOTHER_SERVER__ || 'https://fartak-v34.onrender.com').replace(/\/+$/, '');
const SRV = {
  list: [{ name: 'سرور مرکزی فرتاک', url: FIXED_SERVER_URL, pointer: FIXED_SERVER_URL, key: lsGet('fm_admin_token', ''), remember: true }], cur: 0,
  get now() { return this.list[0] || null; },
  save() { if (!this.list[0]) this.list[0] = { name: 'سرور مرکزی فرتاک', url: FIXED_SERVER_URL, pointer: FIXED_SERVER_URL, key: '', remember: true }; this.list[0].name = 'سرور مرکزی فرتاک'; this.list[0].url = FIXED_SERVER_URL; this.list[0].pointer = FIXED_SERVER_URL; this.list[0].remember = true; lsSet('fm_admin_token', this.list[0].key || ''); lsSet('fm_servers', this.list.map(x => ({ name: x.name, url: FIXED_SERVER_URL, pointer: FIXED_SERVER_URL, key: x.key || '', remember: true }))); lsSet('fm_cur', 0); },
};
const normUrl = (u) => { u = String(u || '').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; return u.replace(/\/+$/, ''); };

/* Several central endpoints may be listed in window.__FARTAK_MOTHER_SERVERS__ (e.g. a custom Cloudflare domain first,
   workers.dev second). Requests use the last working one and fail over automatically on network errors/timeouts. */
const SERVER_URLS = [...new Set([].concat(window.__FARTAK_MOTHER_SERVERS__ || [], FIXED_SERVER_URL).map(normUrl).filter((u) => /^https:\/\//i.test(u)))];
let activeSrv = Math.max(0, SERVER_URLS.indexOf(lsGet('fm_active_server', '')));
async function resolvePointer(s) { return s; }
async function fetchAny(path, init, ms) {
  const urls = SERVER_URLS.length ? SERVER_URLS : [FIXED_SERVER_URL]; let lastErr = null, lastResp = null;
  for (let k = 0; k < urls.length; k++) {
    const i = (activeSrv + k) % urls.length, ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(urls[i] + path, { ...init, signal: ctl.signal }); clearTimeout(t);
      if ((r.status >= 502 && r.status <= 504) || (r.status >= 520 && r.status <= 530)) { lastResp = r; continue; }
      if (i !== activeSrv) { activeSrv = i; lsSet('fm_active_server', urls[i]); }
      return r;
    } catch (e) { clearTimeout(t); lastErr = e; }
  }
  if (lastResp) return lastResp;
  throw lastErr || new TypeError('Failed to fetch');
}
/* ---------- API ---------- */
async function api(method, path, body, opts = {}) {
  const s = opts.server || SRV.now;
  if (!s) throw new Error('سرور تنظیم نشده است');
  try {
    const headers = { 'content-type': 'application/json' }; if (s.key) headers.authorization = 'Bearer ' + s.key;
    const r = await fetchAny(path, { method, headers, cache: 'no-store', body: body === undefined ? undefined : JSON.stringify(body) }, opts.timeout || 20000);
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && !opts.quiet) { S.auth = false; renderAll(); }
    if (!r.ok || j.success === false) { const e = new Error(j.error || 'خطا ' + r.status); e.status = r.status; e.data = j; throw e; }
    return j;
  } catch (e) {
    if (e.status) throw e;
    const ne = new Error(e.name === 'AbortError' ? 'پاسخی از سرور نیامد (timeout)؛ اینترنت یا فیلترشکن را بررسی کنید.' : 'اتصال به سرور برقرار نشد؛ اینترنت یا فیلترشکن را بررسی کنید و دوباره تلاش کنید.');
    ne.network = true; throw ne;
  }
}

/* ---------- state ---------- */
const S = {
  auth: false, page: lsGet('fm_page', 'dash'), target: 'global', cfg: null, loaded: null, global: null, overrides: {},
  dirty: false, apps: [], groups: [], online: 0, serverInfo: null, cache: {},

const PAGES = [
  ['dash', '📊', 'داشبورد', ''], ['apps', '📱', 'اپ‌های متصل', 'مدیریت'], ['server', '☁️', 'سرور و اتصال', 'مدیریت'],
  ['brand', '🎨', 'برند و ظاهر', 'ظاهر اپ عمومی'], ['sections', '🧩', 'بخش‌ها و تب‌ها', 'ظاهر اپ عمومی'], ['banners', '📣', 'اعلان و بنر', 'ظاهر اپ عمومی'],
  ['symbols', '💹', 'نمادها و قیمت', 'بازار'], ['news', '📰', 'خبر و سشن', 'بازار'], ['chart', '📈', 'چارت', 'بازار'], ['indicator', '🎯', 'اندیکاتور فرتاک', 'بازار'],
  ['signals', '⚡', 'سیگنال‌ها', 'معامله'], ['sigset', '🛡️', 'حد سود و ضرر', 'معامله'], ['journal', '📒', 'ژورنال', 'معامله'],
  ['ai', '🤖', 'هوش مصنوعی', 'هوش مصنوعی'], ['plans', '💳', 'اشتراک و پرداخت', 'مالی'], ['users', '👥', 'کاربران و کیف پول', 'مالی'], ['economy', '🎡', 'توکن و گردونه', 'مالی'],
  ['security', '🔐', 'امنیت و پشتیبان', 'سیستم'],
];

function toast(msg, err) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  const d = document.createElement('div'); if (err) d.className = 'e'; d.textContent = msg; t.appendChild(d);
  setTimeout(() => d.remove(), err ? 6000 : 3200);
}
const copy = (txt) => { try { navigator.clipboard.writeText(txt).then(() => toast('کپی شد ✓')); } catch { const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('کپی شد ✓'); } };

/* ---------- config get/set + diff ---------- */
const getP = (p) => p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), S.cfg);
function setP(p, val) {
  const ks = p.split('.'); let o = S.cfg;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val; markDirty();
}
function diff(a, b) {
  if (isObj(a) && isObj(b)) {
    const p = {};
    for (const k of Object.keys(b)) { if (!(k in a)) p[k] = b[k]; else { const d = diff(a[k], b[k]); if (d !== undefined) p[k] = d; } }
    for (const k of Object.keys(a)) if (!(k in b)) p[k] = null;
    return Object.keys(p).length ? p : undefined;
  }
  return JSON.stringify(a) === JSON.stringify(b) ? undefined : b;
}
function markDirty() { const d = diff(S.loaded, S.cfg); S.dirty = d !== undefined; const b = $('#savebar'); if (b) b.classList.toggle('on', S.dirty); }

async function loadConfig() {
  const r = await api('GET', '/api/mother/config/full?target=' + encodeURIComponent(S.target));
  S.global = r.global; S.overrides = r.overrides; S.cfg = clone(r.effective); S.loaded = clone(r.effective); S.dirty = false; markDirty();
}
async function saveConfig() {
  const patch = diff(S.loaded, S.cfg); if (!patch) return;
  const b = $('#btnSave'); if (b) b.disabled = true;
  try { await api('POST', '/api/mother/config', { target: S.target, patch }); await loadConfig(); toast('ذخیره شد و روی اپ‌ها اعمال می‌شود ✓'); renderPage(); }
  catch (e) { toast(e.message, true); } finally { if (b) b.disabled = false; }
}
function discard() { S.cfg = clone(S.loaded); markDirty(); renderPage(); }

/* ---------- form builders (bound to config paths) ---------- */
const attrs = (p, t, extra = '') => `data-p="${esc(p)}" data-t="${t}" ${extra}`;
function F(p, label, type = 'text', o = {}) {
  const v = getP(p);
  const hint = o.hint ? `<span class="hint">${o.hint}</span>` : '';
  const dir = o.ltr ? ' ltr' : '';
  const re = o.re ? 'data-re="1"' : '';
  if (type === 'switch') return `<label class="sw"><span>${label}</span><input type="checkbox" ${attrs(p, 'bool', re)} ${v ? 'checked' : ''}><i></i></label>`;
  if (type === 'textarea') return `<div class="f"><label>${label}</label><textarea ${attrs(p, 'text')} rows="${o.rows || 3}" placeholder="${esc(o.ph || '')}">${esc(v)}</textarea>${hint}</div>`;
  if (type === 'number') return `<div class="f"><label>${label}</label><input type="number" inputmode="decimal" step="${o.step || 'any'}" ${o.min !== undefined ? `min="${o.min}"` : ''} ${o.max !== undefined ? `max="${o.max}"` : ''} ${attrs(p, 'num')} value="${esc(v ?? '')}">${hint}</div>`;
  if (type === 'select') return `<div class="f"><label>${label}</label><select ${attrs(p, 'text', re)}>${o.options.map((x) => { const [val, lb] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lb)}</option>`; }).join('')}</select>${hint}</div>`;
  if (type === 'color') return `<div class="f"><label>${label}</label><input type="color" ${attrs(p, 'text')} value="${esc(v || o.def || '#10b981')}">${hint}</div>`;
  if (type === 'tags') return `<div class="f"><label>${label}</label><input type="text" class="ltr" ${attrs(p, 'tags')} value="${esc((v || []).join(', '))}" placeholder="${esc(o.ph || '')}">${hint}</div>`;
  if (type === 'numtags') return `<div class="f"><label>${label}</label><input type="text" class="ltr" ${attrs(p, 'numtags')} value="${esc((v || []).join(', '))}">${hint}</div>`;
  return `<div class="f"><label>${label}</label><input type="${type === 'password' ? 'password' : 'text'}" class="${dir.trim()}" ${attrs(p, 'text', re)} value="${esc(v ?? '')}" placeholder="${esc(o.ph || '')}" ${o.list ? `list="${o.list}"` : ''}>${hint}</div>`;
}

/** Editable array of objects. fields: [{k,label,type,opts,w}] */
function L(p, title, fields, newItem, o = {}) {
  const arr = getP(p) || [];
  const items = arr.map((it, i) => `<div class="card sub"><div class="item-h"><b class="mini">${esc(o.itemTitle ? o.itemTitle(it, i) : title + ' ' + fa(i + 1))}</b><span class="row">

document.addEventListener('input', onField); document.addEventListener('change', onField);
function onField(e) {
  const el = e.target;
  if (el.dataset?.kv) { // key/value rows
    const o = getP(el.dataset.kv) || {}; const entries = Object.entries(o); const i = +el.dataset.kvi;
    if (entries[i]) { if (el.dataset.kvf === 'k') entries[i][0] = el.value; else entries[i][1] = el.value; setP(el.dataset.kv, Object.fromEntries(entries)); }
    return;
  }
  if (!el.dataset?.p || !el.dataset.t || el.dataset.local) return;
  if (e.type === 'input' && (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'color')) { if (el.type === 'color') { setP(el.dataset.p, el.value); } return; }
  const t = el.dataset.t; let v;
  if (t === 'bool') v = el.checked; else if (t === 'num') v = el.value === '' ? 0 : parseFloat(el.value);
  else if (t === 'tags') v = el.value.split(/[,،\n]/).map((x) => x.trim()).filter(Boolean);
  else if (t === 'numtags') v = el.value.split(/[,،\s]+/).map((x) => parseFloat(x)).filter((x) => !isNaN(x));

}

    return `<div class="card"><h3 class="sec">توکن فرتاک و دعوت دوستان</h3><div class="grid g3">${F('economy.tokenName', 'نام توکن')}${F('economy.signupBonusTokens', 'پاداش ثبت‌نام', 'number')}${F('economy.referralBonusTokens', 'پاداش دعوت‌کننده', 'number')}${F('economy.referralInviteeBonus', 'پاداش دعوت‌شده', 'number')}</div></div>
    <div class="card"><h3 class="sec">تخفیف خرید اشتراک با توکن</h3><div class="grid g3">${F('economy.tokenDiscount.enabled', 'تخفیف توکن فعال', 'switch')}${F('economy.tokenDiscount.tokensPerStep', 'تعداد توکن در هر پله', 'number', { min: 1, step: 1 })}${F('economy.tokenDiscount.percentPerStep', 'درصد تخفیف هر پله', 'number', { min: 0, step: 0.1 })}${F('economy.tokenDiscount.maxPercent', 'سقف تخفیف (٪)', 'number', { min: 0, max: 100, step: 1 })}</div><p class="mini" style="line-height:2">پیش‌فرض: هر ۱۰ توکن = ۱٪ تخفیف، حداکثر ۵۰٪. کاربر در اپ عمومی (کیف پول و صفحهٔ اشتراک) مبلغ تخفیف را به تومان روی هر پلن می‌بیند.</p></div>
    <div class="card"><h3 class="sec">گردونه شانس</h3><div class="grid g3">${F('economy.wheelEnabled', 'گردونه فعال', 'switch')}${F('economy.dailyFreeSpins', 'چرخش رایگان روزانه', 'number')}</div>
      <div style="margin-top:10px">${L('economy.wheelPrizes', 'جایزه', [{ k: 'label', label: 'عنوان جایزه', full: true }, { k: 'icon', label: 'آیکن (ایموجی)' }, { k: 'type', label: 'نوع', type: 'select', opts: { options: [['TOKEN', 'توکن'], ['FREE_SPIN', 'چرخش رایگان'], ['VIP_DAYS', 'روز VIP'], ['DISCOUNT', 'کد تخفیف'], ['BONUS', 'بونوس']] } }, { k: 'value', label: 'مقدار', type: 'number' }, { k: 'probability', label: 'احتمال (وزن)', type: 'number' }, { k: 'color', label: 'رنگ برش', type: 'color' }, { k: 'enabled', label: 'فعال', type: 'switch' }], { id: '__ID__', label: 'جایزه جدید', icon: '🎁', type: 'TOKEN', value: 10, probability: 5, color: '#10B981', enabled: true }, { itemTitle: (p) => p.label, cols: 'g3' })}</div></div>`;
  },
};

/* ---------------- security & backup ---------------- */
PG.security = {
  async render() {
    const sv=(await api('GET','/api/mother/server')).server; const sms=(await api('GET','/api/mother/secrets')).secrets;
    return `<div class="card"><h3 class="sec">🔐 امنیت حساب مدیر</h3><div class="grid g2"><div class="f"><label>رمز فعلی</label><input id="pw_current" type="password" class="ltr" autocomplete="current-password"></div><div class="f"><label>رمز جدید (حداقل ۱۰ نویسه)</label><input id="pw_new" type="password" class="ltr" autocomplete="new-password"></div><div class="f"><label>تکرار رمز جدید</label><input id="pw_confirm" type="password" class="ltr" autocomplete="new-password"></div></div><div class="row"><button class="btn p" data-act="changePassword">تغییر رمز عبور</button><button class="btn" data-act="rotateRecovery">ساخت کد بازیابی جدید</button></div><p class="mini" style="line-height:2">کد بازیابی فقط یک بار نمایش داده می‌شود. آن را در مدیر رمز عبور یا مکانی امن ذخیره کن؛ بازیابی رمز مدیر فقط با همین کد انجام می‌شود (پیامک فقط برای کاربران عمومی است).</p><div id="security_code" class="note ok" style="display:none;direction:ltr;overflow-wrap:anywhere"></div></div>
    <div class="card"><h3 class="sec">📱 پیامک بازیابی رمز کاربران (کاوه‌نگار)</h3><div class="grid g2"><div class="f"><label>کلید API کاوه‌نگار ${sms.hasSms ? '<span class="chip g">فعال</span>' : '<span class="chip r">غیرفعال</span>'}</label><input id="sms_key" type="password" class="ltr" autocomplete="off" placeholder="${esc((sms.sms && sms.sms.apiKey) || 'API Key')}"></div><div class="f"><label>نام قالب تأیید (Template)</label><input id="sms_tpl" class="ltr" autocomplete="off" value="${esc((sms.sms && sms.sms.template) || '')}" placeholder="fartak-reset"></div></div><div class="row"><button class="btn p" data-act="saveSms">ذخیره تنظیمات پیامک</button></div><p class="mini" style="line-height:2">در پنل کاوه‌نگار یک قالب «verify/lookup» با یک توکن (%token) بسازید و نامش را اینجا بنویسید. تا وقتی هر دو مقدار ذخیره نشوند، گزینهٔ «فراموشی رمز» اپ عمومی پیام «با پشتیبانی تماس بگیرید» نشان می‌دهد.</p></div>
    <div class="card"><h3 class="sec">💾 پشتیبان تنظیمات</h3><div class="row"><button class="btn p" data-act="expCfg">⬇ دانلود پشتیبان تنظیمات</button><button class="btn" data-act="impCfg">⬆ بازیابی تنظیمات</button></div><p class="mini">فایل پشتیبان شامل تنظیمات و داده‌های قابل انتقال Worker است. آن را در مکانی امن نگه دار.</p></div>
    <div class="card"><h3 class="sec">حفاظت داده‌ها</h3><div class="mini" style="line-height:2">رمز عبور با هش PBKDF2 در D1 ذخیره می‌شود. نشست‌ها زمان انقضا دارند و بعد از تغییر رمز ابطال می‌شوند. کلید سرویس‌های خارجی را فقط در تنظیمات امن قرار بده و در APK یا فایل عمومی قرار نده.</div></div>`;
  },
};
ACT.saveSms = async () => { await api('POST', '/api/mother/secrets', { sms: { apiKey: $('#sms_key').value.trim(), template: $('#sms_tpl').value.trim() } }); toast('تنظیمات پیامک ذخیره شد ✓'); renderPage(); };
ACT.changePassword = async () => {
  const currentPassword=$('#pw_current').value,newPassword=$('#pw_new').value,confirm=$('#pw_confirm').value;
  if(newPassword.length<10||newPassword!==confirm)throw new Error('رمز جدید باید حداقل ۱۰ نویسه باشد و تکرار آن یکسان باشد.');
  await api('POST','/api/mother/auth/password',{currentPassword,newPassword}); SRV.now.key=''; SRV.save(); S.auth=false; toast('رمز تغییر کرد؛ دوباره وارد شوید.'); loginScreen();
};
ACT.rotateRecovery = async () => {
  const password=prompt('برای تولید کد بازیابی جدید، رمز فعلی مدیر را وارد کن:'); if(!password)return;
  const r=await api('POST','/api/mother/auth/rotate-recovery',{password}); const el=$('#security_code'); el.style.display='block'; el.textContent='کد بازیابی جدید (فقط این بار): '+r.recoveryCode; toast('کد بازیابی جدید ساخته شد؛ همین حالا ذخیره‌اش کن.');
};
ACT.expCfg = async () => { const r=await api('GET','/api/mother/server/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.download='fartak-config-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href); };
ACT.impCfg = async () => { const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const t=JSON.parse(await i.files[0].text());await api('POST','/api/mother/server/import-config',t);await loadConfig();toast('تنظیمات بازیابی شد ✓');renderPage();}catch(e){toast('فایل نامعتبر: '+e.message,true);}};i.click();};

/* ---------------- start ---------------- */
boot();
</script></body></html>
